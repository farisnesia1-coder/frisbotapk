
name: Build FRISS ASSIST APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'
      - 'overrides/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="FRISS-ASSIST-GitHub-Ready-v2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: File $ZIP_FILE tidak ditemukan!"
            echo "File ZIP yang tersedia:"
            find . -maxdepth 2 -name "*.zip"
            exit 1
          fi

          mkdir -p extracted FRISS-ASSIST

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan dalam ZIP!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "Project ditemukan di: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. FRISS-ASSIST/

          echo "Isi folder project:"
          ls -la FRISS-ASSIST

      - name: Apply FRISS source fixes
        shell: bash
        run: |
          set -e
          if [ -d overrides/app ]; then
            cp -a overrides/. FRISS-ASSIST/
          fi
          echo "FRISS overrides applied."
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FRISS-ASSIST/app/src/main/java/id/friss/assist/FloatingAssistantService.kt")
          s = p.read_text()
          s = s.replace('text = "F"', 'text = "AF"')
          nl = chr(10)
          s = s.replace('text = "FRISS ASSIST"' + nl + '            textSize = 18f', 'text = "ASISTEN FRISS"' + nl + '            textSize = 18f')
          s = s.replace('setTextColor(blue)' + nl + '        })' + nl + '        box.addView(TextView(this).apply {' + nl + '            text = "Quick control"', 'setTextColor(blue)' + nl + '            setCompoundDrawablesWithIntrinsicBounds(R.drawable.ic_friss_robot, 0, 0, 0)' + nl + '            compoundDrawablePadding = dp(8)' + nl + '        })' + nl + '        box.addView(TextView(this).apply {' + nl + '            text = "Quick control"')
          p.write_text(s)

          # Allow the floating FRISS Lens results window to load Google Search correctly.
          lens = Path("FRISS-ASSIST/app/src/main/java/id/friss/assist/LensSelectionActivity.kt")
          t = lens.read_text()
          t = t.replace("import android.graphics.RectF\n", "import android.graphics.RectF\nimport android.graphics.drawable.GradientDrawable\nimport android.graphics.drawable.ColorDrawable\nimport android.view.Gravity\nimport android.view.WindowManager\n")
          t = t.replace("            settings.javaScriptEnabled = false\n            loadUrl(", "            settings.javaScriptEnabled = true\n            settings.domStorageEnabled = true\n            settings.loadsImagesAutomatically = true\n            settings.javaScriptCanOpenWindowsAutomatically = false\n            settings.setSupportMultipleWindows(false)\n            loadUrl(")
          t = t.replace("    private fun buildSelectionUi() {\n        content =", "    private fun buildSelectionUi() {\n        window.clearFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND)\n        window.setBackgroundDrawable(ColorDrawable(0xFFF5F9FF.toInt()))\n        window.setLayout(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT)\n        content =")
          t = t.replace("        setContentView(content)\n    }\n\n    override fun onDestroy()", "        content.background = GradientDrawable().apply {\n            setColor(Color.WHITE)\n            cornerRadius = dp(20).toFloat()\n            setStroke(dp(1), 0xFFD8E7FA.toInt())\n        }\n        setContentView(content)\n        window.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))\n        window.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND)\n        val params = window.attributes\n        params.width = minOf(dp(350), resources.displayMetrics.widthPixels - dp(28))\n        params.height = minOf(dp(560), resources.displayMetrics.heightPixels - dp(100))\n        params.gravity = Gravity.CENTER\n        params.dimAmount = 0.32f\n        window.attributes = params\n    }\n\n    private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()\n\n    override fun onDestroy()")
          lens.write_text(t)

          # After selecting a region, hand the search to a movable overlay and
          # return directly to the app that was underneath FRISS ASSIST.
          import re
          lens_source = lens.read_text()
          pattern = r'    private fun showInternalResults\(query: String\) \{.*?\n    \}\n\n    private fun dp\(value: Int\): Int'
          replacement = """    private fun showInternalResults(query: String) {
                if (!android.provider.Settings.canDrawOverlays(this)) {
                    Toast.makeText(this, "Izin tampil di atas aplikasi belum aktif.", Toast.LENGTH_LONG).show()
                    return
                }
                val resultIntent = android.content.Intent(this, LensResultOverlayService::class.java)
                    .putExtra(LensResultOverlayService.EXTRA_QUERY, query)
                startService(resultIntent)
                finish()
            }

            private fun dp(value: Int): Int"""
          lens_source, count = re.subn(pattern, replacement, lens_source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not replace Lens results screen with floating overlay handoff")
          lens.write_text(lens_source)

          # Keep both FRISS overlays completely off the screen while selecting.
          # Restore the bubble on cancel/failure, or when the floating results window closes.
          lens_source = lens.read_text()
          lens_source = lens_source.replace("import android.app.Activity\n", "import android.app.Activity\nimport android.content.Intent\nimport android.os.Build\n")
          lens_source = lens_source.replace("    private lateinit var content: LinearLayout\n", "    private lateinit var content: LinearLayout\n    private var handedOffToResults = false\n")
          lens_source = lens_source.replace("    private fun showInternalResults(query: String) {", "    private fun showInternalResults(query: String) {\n        handedOffToResults = true")
          lens_source = lens_source.replace("    override fun onDestroy() {\n        screenshot?.recycle()", """    override fun onDestroy() {
                if (!handedOffToResults) {
                    val restore = Intent(this, FloatingAssistantService::class.java)
                    if (Build.VERSION.SDK_INT >= 26) startForegroundService(restore) else startService(restore)
                }
                screenshot?.recycle()""")
          lens.write_text(lens_source)

          overlay = Path("FRISS-ASSIST/app/src/main/java/id/friss/assist/LensResultOverlayService.kt")
          if overlay.exists():
              o = overlay.read_text()
              o = o.replace("    override fun onDestroy() {\n        panel?.let", """    override fun onDestroy() {
                val restore = Intent(this, FloatingAssistantService::class.java)
                if (Build.VERSION.SDK_INT >= 26) startForegroundService(restore) else startService(restore)
                panel?.let""")
              overlay.write_text(o)

          # Opacity 0% must fully hide the floating logo.
          floating = Path("FRISS-ASSIST/app/src/main/java/id/friss/assist/FloatingAssistantService.kt")
          u = floating.read_text().replace("opacity = progress.coerceAtLeast(15)", "opacity = progress.coerceIn(0, 100)")
          floating.write_text(u)

          import textwrap
          # Add persistent floating-button size control to the assistant panel.
          u = floating.read_text()
          u = u.replace('    private var opacity = 85\n', '    private var opacity = 85\n    private var bubbleSize = 58\n    private val prefs by lazy { getSharedPreferences("friss_settings", MODE_PRIVATE) }\n')
          u = u.replace('        windowManager = getSystemService(WINDOW_SERVICE) as WindowManager\n', '        windowManager = getSystemService(WINDOW_SERVICE) as WindowManager\n        opacity = prefs.getInt("bubble_opacity", 85)\n        bubbleSize = prefs.getInt("bubble_size", 58).coerceIn(42, 92)\n')
          u = u.replace('WindowManager.LayoutParams(dp(58), dp(58), overlayType(),', 'WindowManager.LayoutParams(dp(bubbleSize), dp(bubbleSize), overlayType(),')
          size_code = '''
              addLabel(box, "Ukuran tombol panel: ${bubbleSize}dp")
              val sizeSeek = SeekBar(this).apply {
              max = 50
              progress = bubbleSize - 42
              setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
              override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
              if (!fromUser) return
              bubbleSize = (42 + progress).coerceIn(42, 92)
              prefs.edit().putInt("bubble_size", bubbleSize).apply()
              bubble?.let { view -> bubbleParams?.let { params ->
              params.width = dp(bubbleSize)
              params.height = dp(bubbleSize)
              try { windowManager.updateViewLayout(view, params) } catch (_: Exception) {}
              } }
              (box.getChildAt(2) as TextView).text = "Ukuran tombol panel: ${bubbleSize}dp"
              }
              override fun onStartTrackingTouch(seekBar: SeekBar?) {}
              override fun onStopTrackingTouch(seekBar: SeekBar?) {}
              })
              }
              box.addView(sizeSeek)


          '''
          size_code = textwrap.dedent(size_code)
          u = u.replace('        addLabel(box, "Opacity logo: $opacity%")\n', size_code + '        addLabel(box, "Opacity logo: $opacity%")\n')
          u = u.replace('                    opacity = progress.coerceIn(0, 100)\n', '                    opacity = progress.coerceIn(0, 100)\n                    prefs.edit().putInt("bubble_opacity", opacity).apply()\n')
          u = u.replace('(box.getChildAt(2) as TextView).text = "Opacity logo: $opacity%"', '(box.getChildAt(4) as TextView).text = "Opacity logo: $opacity%"')
          floating.write_text(u)

          # Route panel searches through the already-approved projection session.
          u = floating.read_text()
          old = """        fun openLens(context: Context) {
                      context.startActivity(
                          Intent(context, LensCaptureActivity::class.java)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  }"""
          new = """        fun openLens(context: Context) {
                      context.stopService(Intent(context, FloatingAssistantService::class.java))
                      LensCaptureService.requestCapture(context)
                  }"""
          if old not in u:
              raise SystemExit("Could not locate floating Google Lens action")
          u = u.replace(old, new)
          floating.write_text(u)

          # Give the main app a richer blue feature banner while preserving its existing controls.
          main = Path("FRISS-ASSIST/app/src/main/java/id/friss/assist/MainActivity.kt")
          m = main.read_text()
          hero = '''
              val hero = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(dp(18), dp(18), dp(18), dp(18))
              background = GradientDrawable(GradientDrawable.Orientation.TL_BR,
              intArrayOf(0xFF126BEB.toInt(), 0xFF3998FF.toInt())).apply { cornerRadius = dp(22).toFloat() }
              }
              hero.addView(text("FRISS SMART PANEL", 17f, Color.WHITE, true))
              hero.addView(text("Akses Lens, kontrol layar, dan tombol mengambang dalam satu asisten.", 12f, 0xFFEAF3FF.toInt(), false).apply { setPadding(0, dp(6), 0, 0) })
              hero.addView(text("QUICK ACCESS  •  PERSONAL CONTROL", 9f, 0xFFD5E8FF.toInt(), true).apply { setPadding(0, dp(12), 0, 0) })
              page.addView(hero, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(14) })

          '''
          hero = textwrap.dedent(hero)
          m = m.replace('        page.addView(brand)\n', '        page.addView(brand)\n' + hero)
          main.write_text(m)
          PY

      - name: Replace Lens selection with native image sharing
        shell: bash
        run: |
          set -e
          mkdir -p FRISS-ASSIST/app/src/main/java/id/friss/assist
          cat > FRISS-ASSIST/app/src/main/java/id/friss/assist/LensSelectionActivity.kt <<'KOTLIN'
          package id.friss.assist

          import android.app.Activity
          import android.content.ClipData
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.content.FileProvider
          import java.io.File
          import java.io.FileOutputStream

          class LensSelectionActivity : Activity() {
              private var screenshot: Bitmap? = null
              private lateinit var selector: ScreenAreaSelector
              private var sharing = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  screenshot = LensCaptureStore.screenshot
                  val image = screenshot
                  if (image == null) {
                      Toast.makeText(this, "Screenshot tidak tersedia. Coba Lens lagi.", Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }
                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFFF4F8FF.toInt())
                  }
                  root.addView(TextView(this).apply {
                      text = "PILIH AREA LAYAR"
                      textSize = 19f
                      setTextColor(0xFF126BEB.toInt())
                      setPadding(dp(18), dp(18), dp(18), dp(6))
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                  })
                  root.addView(TextView(this).apply {
                      text = "Geser kotak ke objek yang ingin dicari, lalu tekan tombol centang."
                      textSize = 13f
                      setTextColor(0xFF52647C.toInt())
                      setPadding(dp(18), 0, dp(18), dp(12))
                  })
                  selector = ScreenAreaSelector(this, image)
                  root.addView(selector, LinearLayout.LayoutParams(-1, 0, 1f))
                  val actions = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(dp(14), dp(10), dp(14), dp(14))
                  }
                  val cancel = Button(this).apply {
                      text = "×  Batal"
                      isAllCaps = false
                      setOnClickListener { finish() }
                  }
                  val confirm = Button(this).apply {
                      text = "✓  Kirim ke Lens"
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      backgroundTintList = android.content.res.ColorStateList.valueOf(0xFF1677FF.toInt())
                      setOnClickListener { shareSelection() }
                  }
                  actions.addView(cancel, LinearLayout.LayoutParams(0, dp(52), 1f).apply { marginEnd = dp(6) })
                  actions.addView(confirm, LinearLayout.LayoutParams(0, dp(52), 1f).apply { marginStart = dp(6) })
                  root.addView(actions)
                  setContentView(root)
              }

              private fun shareSelection() {
                  if (sharing) return
                  val source = screenshot ?: return
                  val rect = selector.getCropRect(source.width, source.height)
                  if (rect.width() < 12 || rect.height() < 12) {
                      Toast.makeText(this, "Area terlalu kecil. Perbesar pilihan dulu.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  try {
                      val crop = Bitmap.createBitmap(source, rect.left, rect.top, rect.width(), rect.height())
                      val folder = File(cacheDir, "lens-share").apply { mkdirs() }
                      val file = File(folder, "friss-selection.jpg")
                      FileOutputStream(file).use { stream ->
                          crop.compress(Bitmap.CompressFormat.JPEG, 94, stream)
                          stream.flush()
                      }
                      crop.recycle()
                      val uri: Uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      val send = Intent(Intent.ACTION_SEND).apply {
                          type = "image/jpeg"
                          putExtra(Intent.EXTRA_STREAM, uri)
                          clipData = ClipData.newUri(contentResolver, "Selected screen area", uri)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      sharing = true
                      startActivityForResult(Intent.createChooser(send, "Kirim gambar ke Google Lens"), 9102)
                  } catch (e: Exception) {
                      sharing = false
                      Toast.makeText(this, "Gagal membagikan area: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              @Deprecated("Chooser result callback")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 9102) finish()
              }

              override fun onDestroy() {
                  val restore = Intent(this, FloatingAssistantService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(restore) else startService(restore)
                  screenshot?.recycle()
                  screenshot = null
                  LensCaptureStore.screenshot = null
                  super.onDestroy()
              }

              private fun dp(value: Int) = (value * resources.displayMetrics.density).toInt()

              private class ScreenAreaSelector(context: android.content.Context, private val bitmap: Bitmap) : View(context) {
                  private val imagePaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  private val shadePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0x88000000.toInt() }
                  private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = 0xFF1677FF.toInt()
                      style = Paint.Style.STROKE
                      strokeWidth = 5f
                  }
                  private val handlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
                  private val selection = RectF()
                  private val imageBounds = RectF()
                  private var lastX = 0f
                  private var lastY = 0f
                  private var resizing = false
                  private val handleRadius = 22f

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val scale = minOf(width.toFloat() / bitmap.width, height.toFloat() / bitmap.height)
                      val dw = bitmap.width * scale
                      val dh = bitmap.height * scale
                      val left = (width - dw) / 2f
                      val top = (height - dh) / 2f
                      imageBounds.set(left, top, left + dw, top + dh)
                      canvas.drawColor(0xFF17263A.toInt())
                      canvas.drawBitmap(bitmap, null, imageBounds, imagePaint)
                      if (selection.isEmpty) selection.set(left + dw * .15f, top + dh * .25f, left + dw * .85f, top + dh * .60f)
                      canvas.save()
                      canvas.clipRect(imageBounds)
                      canvas.drawRect(imageBounds, shadePaint)
                      val save = canvas.save()
                      canvas.clipRect(selection)
                      canvas.drawBitmap(bitmap, null, imageBounds, imagePaint)
                      canvas.restoreToCount(save)
                      canvas.drawRoundRect(selection, 8f, 8f, borderPaint)
                      canvas.drawCircle(selection.left, selection.top, handleRadius, handlePaint)
                      canvas.drawCircle(selection.right, selection.top, handleRadius, handlePaint)
                      canvas.drawCircle(selection.left, selection.bottom, handleRadius, handlePaint)
                      canvas.drawCircle(selection.right, selection.bottom, handleRadius, handlePaint)
                      canvas.restore()
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              lastX = event.x
                              lastY = event.y
                              resizing = kotlin.math.abs(event.x - selection.right) < handleRadius * 1.8f &&
                                  kotlin.math.abs(event.y - selection.bottom) < handleRadius * 1.8f
                              return true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - lastX
                              val dy = event.y - lastY
                              if (resizing) {
                                  selection.right = (selection.right + dx).coerceIn(selection.left + 70f, imageBounds.right)
                                  selection.bottom = (selection.bottom + dy).coerceIn(selection.top + 70f, imageBounds.bottom)
                              } else {
                                  val w = selection.width()
                                  val h = selection.height()
                                  val l = (selection.left + dx).coerceIn(imageBounds.left, imageBounds.right - w)
                                  val t = (selection.top + dy).coerceIn(imageBounds.top, imageBounds.bottom - h)
                                  selection.set(l, t, l + w, t + h)
                              }
                              lastX = event.x
                              lastY = event.y
                              invalidate()
                              return true
                          }
                          MotionEvent.ACTION_UP -> return true
                      }
                      return true
                  }

                  fun getCropRect(sourceWidth: Int, sourceHeight: Int): android.graphics.Rect {
                      val sx = sourceWidth / imageBounds.width()
                      val sy = sourceHeight / imageBounds.height()
                      val l = ((selection.left - imageBounds.left) * sx).toInt().coerceIn(0, sourceWidth - 1)
                      val t = ((selection.top - imageBounds.top) * sy).toInt().coerceIn(0, sourceHeight - 1)
                      val r = ((selection.right - imageBounds.left) * sx).toInt().coerceIn(l + 1, sourceWidth)
                      val b = ((selection.bottom - imageBounds.top) * sy).toInt().coerceIn(t + 1, sourceHeight)
                      return android.graphics.Rect(l, t, r, b)
                  }
              }
          }
          KOTLIN
      - name: Verify Android Project
        run: |
          set -e

          if [ ! -f "FRISS-ASSIST/settings.gradle.kts" ] && \
             [ ! -f "FRISS-ASSIST/settings.gradle" ]; then
            echo "ERROR: Settings Gradle tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "FRISS-ASSIST/app/build.gradle.kts" ] && \
             [ ! -f "FRISS-ASSIST/app/build.gradle" ]; then
            echo "ERROR: App build.gradle tidak ditemukan!"
            exit 1
          fi

          echo "Struktur project valid."

      - name: Package Extracted Source
        run: |
          cd FRISS-ASSIST
          zip -qr ../FRISS-ASSIST-SOURCE.zip .

      - name: Upload Extracted Source
        uses: actions/upload-artifact@v4
        with:
          name: FRISS-ASSIST-SOURCE
          path: FRISS-ASSIST-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build Debug APK
        run: |
          gradle -p FRISS-ASSIST assembleDebug --stacktrace

      - name: Check APK
        run: |
          APK="FRISS-ASSIST/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak berhasil dibuat!"
            exit 1
          fi

          echo "APK berhasil dibuat!"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRISS-ASSIST-APK
          path: FRISS-ASSIST/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
