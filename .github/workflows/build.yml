name: Build FRISS ASSIST APK
on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'
      - 'overrides/**'
permissions:
  contents: read
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source project
        run: |
          set -e
          mkdir -p extracted FRISS-ASSIST
          unzip -q FRISS-ASSIST-GitHub-Ready-v2.zip -d extracted
          PROJECT_DIR=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. FRISS-ASSIST/
      - name: Apply maintained source overrides
        run: |
          set -e
          cp -a overrides/. FRISS-ASSIST/
      - name: Build debug APK
        working-directory: FRISS-ASSIST
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRISS-ASSIST-APK
          path: FRISS-ASSIST/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
