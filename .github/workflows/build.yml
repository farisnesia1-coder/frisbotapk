
name: FRISS ASSIST - Auto Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Extract ZIP
        run: |
          unzip -o FRISS-ASSIST-GitHub-Ready.zip
          echo "Project berhasil diekstrak!"
          ls -la FRISS-ASSIST

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FRISS ASSIST APK
        working-directory: FRISS-ASSIST
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRISS-ASSIST-APK
          path: FRISS-ASSIST/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
